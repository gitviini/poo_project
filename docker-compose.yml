services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
    environment:
      # Senha que criptografa o arquivo do banco (AES). Defina no host ou em um .env;
      # o valor abaixo e so o fallback de desenvolvimento.
      - DB_FILE_PASSWORD=${DB_FILE_PASSWORD:-devfilepwd}
    restart: always

volumes:
  app-data:
