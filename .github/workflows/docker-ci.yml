name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante que o histórico do Git venha completo para evitar erros no PR

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker Compose
        run: docker compose build

      - name: Verify Container Build
        run: |
          docker compose up -d
          
          # Aguarda o Spring Boot iniciar usando um loop de healthcheck (máx 60s)
          echo "Aguardando a aplicação responder em http://localhost:8080..."
          for i in {1..12}; do
            if curl --fail -s http://localhost:8080 > /dev/null; then
              echo "Aplicação subiu com sucesso!"
              break
            fi
            echo "Tentativa $i/12: Aplicação ainda não está pronta, aguardando 5 segundos..."
            sleep 5
          done
          
          # Verifica o status final dos containers
          docker compose ps
          
          # Teste definitivo: se falhar aqui, o workflow para
          curl --fail http://localhost:8080 || (docker compose logs && exit 1)
          
          docker compose down

      - name: Create PR to prod
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verifica se já existe um PR aberto de main para prod para evitar erro feio no log
          PR_EXISTS=$(gh pr list --base prod --head main --state open --json id -q '. | length')
          
          if [ "$PR_EXISTS" -eq "0" ]; then
            gh pr create --base prod --head main --title "Deploy: main to prod" --body "PR automático criado após sucesso no Docker CI."
          else
            echo "Já existe um PR aberto de main para prod."
          fi