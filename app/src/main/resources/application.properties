spring.application.name=app
# Criptografia em repouso: CIPHER=AES criptografa o arquivo inteiro do banco.
# A senha vira "<senha do arquivo> <senha do usuario>" (separadas por espaco).
# A senha do arquivo vem da variavel de ambiente DB_FILE_PASSWORD (default p/ dev).
spring.datasource.url=jdbc:h2:file:./data/db;CIPHER=AES
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_FILE_PASSWORD:devfilepwd} sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.port-header=x-forwarded-port
server.tomcat.use-relative-redirects=true

# Backup e continuidade de operacao
app.backup.dir=./data/backups
app.backup.retention=5
app.backup.cron=0 0 3 * * *

# Desligamento gracioso: espera as requisicoes em andamento terminarem
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s