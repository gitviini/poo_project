<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="/img/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/script.js"></script>
</head>
<body>
    <main>
        <div th:insert="~{toast :: toast}"></div>

        <div class="container-images">
            <img src="img/cards.png" alt="">
        </div>
        <div class="container-form">
            <h2 class="title">Bem vindo de volta!</h2>
            <form action="/login" method="post">
                <label for="userId">
                    ID de Usuário
                    <img src="/img/icons/user-regular-full.svg" alt="" class="icon-small"></label>
                <input id="userId" name="userId" class="input auth" type="text" placeholder="Digite o seu ID de usuário">
                <label for="password">
                    Senha
                    <img src="img/icons/lock-solid-full.svg" alt="" class="icon-small"></label>
                <input id="password" name="password" class="input auth" type="password" placeholder="Digite a sua senha">
                <button class="btn auth primary">Enviar</button>
            </form>
            <div class="container-link">
            <a href="/forgot-password" class="link">Esqueci minha senha</a>
            <p>Ainda não é cadastrado?</p>
            <a href="/signup" class="link">Cadastre-se</a>
            </div>
        </div>
    </main>
</body>
</html>
