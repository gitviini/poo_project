<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="shortcut icon" href="/img/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <script
      src="https://kit.fontawesome.com/5684532330.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/searchFilter.js"></script>
  </head>
  <body>
    <div th:insert="~{toast :: toast}"></div>

    <div class="container-toast"></div>
    <header class="header">
      <img src="/img/logo.svg" class="logo" alt="" />
      <a href="/login" class="link">login</a><br />
      <a href="/signup" class="link">signup</a>
    </header>
    <main>
      <section>
        <div class="container-banner">
          <img class="banner" src="/img/arena_banner.svg" alt="" />
        </div>

        <div class="container-link">
          <h3>Venha conhecer a Arena de Pernambuco</h3>
          <button class="btn primary">Agendar visita</button>
        </div>

        <hr />

        <div class="container-link">
          <h3>Eventos</h3>
          <p>*Não encontrou o evento que queria? Nos envie uma sugestão!</p>
          <a href="/event/sugestion/new" class="btn primary">Enviar uma sugestão</a>
        </div>
        <hr />

        <div class="container-search-bar-and-filter">
          <input
            type="text"
            class="input second search-bar"
            placeholder="Pesquise por eventos"
          />
          <button class="btn second filter filter-button">
            <i class="fa-solid fa-filter"></i>
          </button>
        </div>

        <div class="container-filters">
          <div class="filter-field">
            <label for="filter-category">Categoria</label>
            <input
              type="text"
              name="category"
              id="filter-category"
              class="input second"
              placeholder="Ex.: futebol"
            />
          </div>
          <div class="filter-field">
            <label for="filter-date">Data</label>
            <input
              type="date"
              name="date"
              id="filter-date"
              class="input second"
            />
          </div>
          <div class="filter-actions">
            <button type="button" class="btn second filter-apply">
              Aplicar
            </button>
            <button type="button" class="btn second filter-clear" hidden>
              <i class="fa-solid fa-xmark"></i> Limpar
            </button>
          </div>
        </div>

        <div class="cards-event">
          <p>Carregando eventos...</p>
        </div>
      </section>
    </main>
  </body>
</html>
