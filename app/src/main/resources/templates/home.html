<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="shortcut icon" href="/img/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <script
      src="https://kit.fontawesome.com/5684532330.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/searchFilter.js"></script>
  </head>
  <body>
    <div th:insert="~{toast :: toast}"></div>

    <div class="container-toast"></div>
    <header class="header">
      <div class="header-container">
        <img src="/img/logo.svg" class="logo" alt="" />
      </div>

      <div class="header-container">
        <a th:if="${user.role == 'admin'}" href="/admin/dashboard" class="btn third" style="margin-right: 1rem;">Dashboard</a>
        
        <a
          class="link header-container"
          th:href="@{/profile/{userId}(userId=${user.userId})}"
        >
          <span th:text="${user.userId}"></span>

          <img
            th:src="${user.imageBase64 != null ? user.imageBase64 : '/img/default-avatar.svg'}"
            alt="Profile image"
            class="profile-image"
            id="profileImageDisplay"
          />
        </a>
      </div>
    </header>
    <main>
      <section>
        <div class="container-banner">
          <img class="banner" src="/img/arena_banner.svg" alt="" />
        </div>

        <div class="container-link">
          <h3>Venha conhecer a Arena de Pernambuco</h3>
          <a href="/scheduled-visit/new" class="btn primary" style="margin-bottom: 1rem;">Agendar visita</a>

          <div th:if="${not #lists.isEmpty(scheduledVisits)}">
            <h4 style="margin-top: 1rem;">Meus Agendamentos de Visita</h4>
            <table class="visit-table" style="width: 100%; border-collapse: collapse; margin-top: 0.5rem;">
              <thead>
                <tr style="text-align: left; border-bottom: 2px solid #00000030;">
                  <th style="padding: 0.5rem;">Data</th>
                  <th style="padding: 0.5rem;">Horário</th>
                  <th style="padding: 0.5rem;">Pessoas</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="sv : ${scheduledVisits}" style="border-bottom: 1px solid #00000010;">
                  <td style="padding: 0.5rem;" th:text="${#temporals.format(sv.visit.date, 'dd/MM/yyyy')}"></td>
                  <td style="padding: 0.5rem;" th:text="${sv.visit.time}"></td>
                  <td style="padding: 0.5rem;" th:text="${sv.numberOfPeople}"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="container-link">
          <h3>Eventos</h3>
          <p>*Não encontrou o evento que queria? Nos envie uma sugestão!</p>
          <a href="/event/sugestion/new" class="btn primary"
            >Enviar uma sugestão</a
          >
        </div>
        <hr />

        <div class="container-search-bar-and-filter">
          <input
            type="text"
            class="input second search-bar"
            placeholder="Pesquise por eventos"
          />
          <button class="btn second filter filter-button">
            <i class="fa-solid fa-filter"></i>
          </button>
        </div>

        <div class="container-filters">
          <div class="filter-field">
            <label for="filter-category">Categoria</label>
            <input
              type="text"
              name="category"
              id="filter-category"
              class="input second"
              placeholder="Ex.: futebol"
            />
          </div>
          <div class="filter-field">
            <label for="filter-date">Data</label>
            <input
              type="date"
              name="date"
              id="filter-date"
              class="input second"
            />
          </div>
          <div class="filter-actions">
            <button type="button" class="btn second filter-apply">
              Aplicar
            </button>
            <button type="button" class="btn second filter-clear" hidden>
              <i class="fa-solid fa-xmark"></i> Limpar
            </button>
          </div>
        </div>

        <div class="cards-event">
          <p>Carregando eventos...</p>
        </div>
      </section>
    </main>
  </body>
</html>
