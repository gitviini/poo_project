<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event</title>
    <link rel="shortcut icon" href="/img/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/event.css" />
    <script src="https://kit.fontawesome.com/5684532330.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="header">
      <button onclick="window.history.back()" class="icon small"><i class=" fa-solid fa-arrow-left"></i></button>
    </header>
    <main>
      <h2 th:text="${event.title}" class="title"></h2>

      <hr />

      <p th:text="${#dates.format(event.date, 'dd/MM/yyyy')}" class="date"></p>

      <div class="container-banner">
        <div th:if="${event.imageBase64}">
          <img th:src="${event.imageBase64}" alt="" />
        </div>
        <div th:unless="${event.imageBase64}">
          <img src="/img/arena_banner.svg" alt="" />
        </div>
      </div>

      <p th:text="${event.description}" class="description"></p>

      <div class="container-price">
        <span th:text="${event.currency}" class="currency"></span>
        <span th:text="${event.price}" class="price"></span>
      </div>
    </main>
  </body>
</html>
