<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/recovery.css">
    <script src="/js/placeholderClear.js"></script>
</head>
<body>
    <main>
        <div th:insert="~{toast :: toast}"></div>
        <div class="container-images">
            <img src="img/cards.png" alt="">
        </div>
        <div th:if="${!sucesso}" id="form-container-recovery">
            <h2 class="title">Recuperar senha</h2>
            <form action="/forgot-password" method="post">
                <label for="email">
                    Email
                    <img src="/img/icons/envelope-solid-full.svg" alt="" class="icon-small"></label>
                <input id="email" name="email" class="input auth" type="email" placeholder="Digite o seu email para recuperação de senha" required>
                <button class="btn auth primary">Enviar</button>
            </form>
             <div class="container-link">
                <a href="/login" class="voltar-link">Voltar</a>
             </div>
        </div>
        <div th:if="${sucesso}" id="sucess-container" class="hidden">
            <div>
            <h2>Email enviado com sucesso!</h2>
            <p>Se o email existir, você receberá um link para redefinir sua senha</p>
            <a href="/login" class="voltar-link">Voltar</a>
            </div>
        </div>
    </main>
</body>
</html>
