<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="shortcut icon" href="/img/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script
      src="https://kit.fontawesome.com/5684532330.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/searchFilter.js?v=2"></script>
  </head>
  <body>
    <div th:insert="~{toast :: toast}"></div>

    <div class="container-toast"></div>
    <header class="header">
      <div class="header-container">
        <a href="/">
          <img src="/img/logo.svg" class="logo" alt="" />
        </a>
      </div>

      <a
        class="link header-container"
        th:href="@{/profile/{userId}(userId=${user.userId})}"
      >
        <span th:text="${user.userId}"></span>

        <img
          th:src="${user.imageBase64 != null ? user.imageBase64 : 'https://picsum.photos/100/100'}"
          alt="Profile image"
          class="profile-image"
          id="profileImageDisplay"
        />
      </a>
    </header>
    <main>
      <section>
        <div class="container-banner">
          <img class="banner" src="/img/arena_banner.svg" alt="" />
        </div>

        <div th:insert="~{admin/chart :: chart}"></div>

        <hr />

        <div class="container-link">
          <h3>Visitas</h3>
          <p>*Gerencie as visitas guiadas à Arena</p>
          <a href="/admin/visit/new" class="btn primary" style="margin-bottom: 1rem;">Adicionar nova visita</a>
          
          <table class="visit-table" style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
            <thead>
              <tr style="text-align: left; border-bottom: 2px solid #00000030;">
                <th style="padding: 0.5rem;">Data</th>
                <th style="padding: 0.5rem;">Horário</th>
                <th style="padding: 0.5rem;">Vagas</th>
                <th style="padding: 0.5rem;">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="visit : ${visits}" style="border-bottom: 1px solid #00000010;">
                <td style="padding: 0.5rem;" th:text="${#temporals.format(visit.date, 'dd/MM/yyyy')}"></td>
                <td style="padding: 0.5rem;" th:text="${visit.time}"></td>
                <td style="padding: 0.5rem;" th:text="${visit.capacity}"></td>
                <td style="padding: 0.5rem;">
                  <div style="display: flex; gap: 0.5rem;">
                    <a th:href="@{/admin/visit/edit/{id}(id=${visit.id})}" class="btn third" style="padding: 0.25rem 0.5rem;">Editar</a>
                    <form th:action="@{/admin/visit/delete/{id}(id=${visit.id})}" method="POST" onsubmit="return confirm('Deseja excluir esta visita?')">
                      <button type="submit" class="btn third danger" style="padding: 0.25rem 0.5rem;">Excluir</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(visits)}">
                <td colspan="4" style="text-align: center; padding: 1rem;">Nenhuma visita cadastrada.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="container-link">
          <h3>Eventos</h3>
          <p>*Adicione eventos visíveis para todos</p>
          <a href="/admin/event/new" class="btn primary">Adicionar novo evento</a>
        </div>
        <hr />

        <div class="container-search-bar-and-filter">
          <input
            type="text"
            class="input second search-bar"
            placeholder="Pesquise por eventos"
          />
          <button class="btn second filter filter-button">
            <i class="fa-solid fa-filter"></i>
          </button>
        </div>

        <div class="container-filters">
          <div class="filter-field">
            <label for="filter-category">Categoria</label>
            <input
              type="text"
              name="category"
              id="filter-category"
              class="input second"
              placeholder="Ex.: futebol"
            />
          </div>
          <div class="filter-field">
            <label for="filter-date">Data</label>
            <input
              type="date"
              name="date"
              id="filter-date"
              class="input second"
            />
          </div>
          <div class="filter-actions">
            <button type="button" class="btn second filter-apply">
              Aplicar
            </button>
            <button type="button" class="btn second filter-clear" hidden>
              <i class="fa-solid fa-xmark"></i> Limpar
            </button>
          </div>
        </div>

        <div class="cards-event">
          <p>Carregando eventos...</p>
        </div>
    </main>
  </body>
</html>
