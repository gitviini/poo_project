<!doctype html>
<html lang="pt-br">
  <body>
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event</title>
    <link rel="shortcut icon" href="/img/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/event.css" />
    <script src="https://kit.fontawesome.com/5684532330.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="header">
      <a href="/admin/dashboard" class="icon small"><i class=" fa-solid fa-arrow-left"></i></a>
      <h3>Criação de eventos</h3>
    </header>
    <main>
    <form class="event-form" th:action="@{/admin/event/save}" th:object="${event}" method="post">
      <input class="input second" type="text" th:field="*{title}" placeholder="Título" required />
      <input class="input second" type="date" th:field="*{date}" required />

      <select class="btn second" name="category" th:field="*{category}" required>
        <option value="show">Show</option>
        <option value="futebol">Futebol</option>
        <option value="cultural">Cultural</option>
      </select>

      <!-- <input
        type="text"
        th:field="*{category}"
        placeholder="Categoria (ex: Show, Futebol)"
        required
      /> -->
      <textarea class="input second" th:field="*{description}" placeholder="Descrição"></textarea>

      <select class="btn second" name="currency" th:field="*{currency}" required>
        <option value="BRL">Real (R$)</option>
        <option value="USD">Dólar (US$)</option>
      </select>

      <input
        class="input second"
        type="number"
        step="0.01"
        th:field="*{price}"
        placeholder="Preço do Ingresso (Ex: 50.00)"
        required
      />

      <input class="input second" type="hidden" id="imageBase64" th:field="*{imageBase64}" />

      <label class="label">Capa do Evento</label>
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        onchange="previewImage()"
      />

      <div id="previewContainer" style="margin: 10px 0">
        <img
          id="imagePreview"
          src="#"
          alt="Prévia"
          style="display: none; max-width: 200px; border-radius: 8px"
        />
      </div>

      <button class="btn primary" type="submit">Publicar Evento</button>
    </form>

    <script>
      function previewImage() {
        const file = document.getElementById("imageInput").files[0];
        const reader = new FileReader();

        reader.onloadend = function () {
          // Exibe a prévia
          const preview = document.getElementById("imagePreview");
          preview.src = reader.result;
          preview.style.display = "block";

          // Salva o valor no campo oculto para o Spring Boot receber
          document.getElementById("imageBase64").value = reader.result;
        };

        if (file) {
          reader.readAsDataURL(file);
        }
      }
    </script>
    </main>
  </body>
</html>
